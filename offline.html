<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background:#eef1f4; color:#14213d;
         display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; text-align:center; padding:1rem; }
  .box { background:#fff; border:1px solid #cbd3dc; border-radius:10px; padding:2rem; max-width:420px; }
  button { padding:.55rem 1.1rem; border:0; border-radius:6px; background:#1f6f5c; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You are offline</h1>
    <p>This page is not saved on your device yet. Reconnect to the internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
